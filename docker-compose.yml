# Optional PostgreSQL for the final submission. SQLite is used by default for zero-setup development.
# 1) docker compose up -d postgres
# 2) in backend/.env set DATABASE_URL=postgresql+psycopg://intelliward:intelliward@localhost:5432/intelliward
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intelliward
      POSTGRES_PASSWORD: intelliward
      POSTGRES_DB: intelliward
    ports:
      - "5432:5432"
    volumes:
      - intelliward_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelliward"]
      interval: 5s
      retries: 10
volumes:
  intelliward_pg:
