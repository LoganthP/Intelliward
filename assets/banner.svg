<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="IntelliWard: AI-powered hospital staff monitoring with tamper-evident audit logging" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b16"/>
      <stop offset="0.55" stop-color="#0a1f33"/>
      <stop offset="1" stop-color="#0b3a4a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- sweeping scan band -->
    <rect x="-220" y="0" width="220" height="320" fill="url(#scan)">
      <animate attributeName="x" from="-220" to="1200" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- emblem: pulsing rings + shield + cross -->
    <g transform="translate(0,0)">
      <circle cx="150" cy="150" r="60" fill="none" stroke="#38bdf8" stroke-width="2">
        <animate attributeName="r" values="58;105" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.55;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="150" r="60" fill="none" stroke="#5eead4" stroke-width="2">
        <animate attributeName="r" values="58;105" dur="3s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.55;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <g filter="url(#glow)">
        <path d="M150 92 L206 112 V162 C206 198 182 220 150 234 C118 220 94 198 94 162 V112 Z"
              fill="#0b2a40" stroke="url(#title)" stroke-width="3.5"/>
        <rect x="141" y="124" width="18" height="62" rx="3" fill="#5eead4">
          <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="119" y="146" width="62" height="18" rx="3" fill="#5eead4">
          <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- title block -->
    <text x="250" y="148" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="800" fill="url(#title)" letter-spacing="1">IntelliWard</text>
    <text x="252" y="190" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="600" fill="#e2e8f0">AI-Powered Hospital Staff Monitoring &amp; Task Verification</text>
    <text x="252" y="220" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#94a3b8">with Tamper-Evident Audit Logging</text>

    <!-- ECG trace -->
    <path d="M800 120 H850 L862 111 L874 120 H900 L910 84 L926 154 L938 104 L946 120 H990 L1002 111 L1014 120 H1040 L1050 84 L1066 154 L1078 104 L1086 120 H1160"
          fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
          pathLength="600" stroke-dasharray="600" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="600;0;0;-600" keyTimes="0;0.45;0.7;1" dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- hash chain strip -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12">
      <!-- links -->
      <g stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.8">
        <line x1="370" y1="271" x2="400" y2="271"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></line>
        <line x1="520" y1="271" x2="550" y2="271"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></line>
        <line x1="670" y1="271" x2="700" y2="271"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></line>
        <line x1="820" y1="271" x2="850" y2="271"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></line>
        <line x1="970" y1="271" x2="1000" y2="271"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></line>
      </g>
      <!-- blocks -->
      <g>
        <rect x="250" y="255" width="120" height="32" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.7"/>
        <text x="310" y="276" text-anchor="middle" fill="#7dd3fc">#0001 · 9f3a…</text>
        <rect x="400" y="255" width="120" height="32" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.7"/>
        <text x="460" y="276" text-anchor="middle" fill="#7dd3fc">#0002 · c71e…</text>
        <rect x="550" y="255" width="120" height="32" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.7"/>
        <text x="610" y="276" text-anchor="middle" fill="#7dd3fc">#0003 · 04bd…</text>
        <rect x="700" y="255" width="120" height="32" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.7"/>
        <text x="760" y="276" text-anchor="middle" fill="#7dd3fc">#0004 · e8a2…</text>
        <rect x="850" y="255" width="120" height="32" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.7"/>
        <text x="910" y="276" text-anchor="middle" fill="#7dd3fc">#0005 · 51d6…</text>
        <rect x="1000" y="255" width="120" height="32" rx="7" fill="#0b2a2a" stroke="#5eead4"/>
        <text x="1060" y="276" text-anchor="middle" fill="#5eead4">anchored ✓</text>
      </g>
      <!-- sequential highlight -->
      <g fill="#5eead4" fill-opacity="0">
        <rect x="250" y="255" width="120" height="32" rx="7"><animate attributeName="fill-opacity" values="0;0.28;0;0" keyTimes="0;0.06;0.16;1" dur="5s" begin="0s" repeatCount="indefinite"/></rect>
        <rect x="400" y="255" width="120" height="32" rx="7"><animate attributeName="fill-opacity" values="0;0.28;0;0" keyTimes="0;0.06;0.16;1" dur="5s" begin="0.7s" repeatCount="indefinite"/></rect>
        <rect x="550" y="255" width="120" height="32" rx="7"><animate attributeName="fill-opacity" values="0;0.28;0;0" keyTimes="0;0.06;0.16;1" dur="5s" begin="1.4s" repeatCount="indefinite"/></rect>
        <rect x="700" y="255" width="120" height="32" rx="7"><animate attributeName="fill-opacity" values="0;0.28;0;0" keyTimes="0;0.06;0.16;1" dur="5s" begin="2.1s" repeatCount="indefinite"/></rect>
        <rect x="850" y="255" width="120" height="32" rx="7"><animate attributeName="fill-opacity" values="0;0.28;0;0" keyTimes="0;0.06;0.16;1" dur="5s" begin="2.8s" repeatCount="indefinite"/></rect>
        <rect x="1000" y="255" width="120" height="32" rx="7"><animate attributeName="fill-opacity" values="0;0.4;0;0" keyTimes="0;0.06;0.16;1" dur="5s" begin="3.5s" repeatCount="indefinite"/></rect>
      </g>
    </g>

    <!-- border -->
    <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2"/>
  </g>
</svg>
