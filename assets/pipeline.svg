<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="IntelliWard pipeline: camera observation, verified identity, role and ward, visit, task evidence, audit trail, live dashboard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2740"/>
      <stop offset="1" stop-color="#0a1626"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="210" rx="16" fill="#060d19"/>
  <rect x="1" y="1" width="1198" height="208" rx="15" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2"/>

  <!-- connectors -->
  <g stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow)" stroke-opacity="0.85">
    <line x1="162" y1="105" x2="187" y2="105"><animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.1s" repeatCount="indefinite"/></line>
    <line x1="332" y1="105" x2="357" y2="105"><animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.1s" repeatCount="indefinite"/></line>
    <line x1="502" y1="105" x2="527" y2="105"><animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.1s" repeatCount="indefinite"/></line>
    <line x1="672" y1="105" x2="697" y2="105"><animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.1s" repeatCount="indefinite"/></line>
    <line x1="842" y1="105" x2="867" y2="105"><animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.1s" repeatCount="indefinite"/></line>
    <line x1="1012" y1="105" x2="1037" y2="105"><animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.1s" repeatCount="indefinite"/></line>
  </g>

  <!-- nodes -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <!-- 1 -->
    <rect x="18" y="62" width="144" height="86" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.45"/>
    <circle cx="40" cy="80" r="11" fill="url(#accent)"/><text x="40" y="84.5" font-size="12" font-weight="700" fill="#06101d">1</text>
    <text x="96" y="108" font-size="15" font-weight="700" fill="#e2e8f0">Camera</text>
    <text x="90" y="130" font-size="11" fill="#94a3b8">Webcam · RTSP · MP4</text>
    <!-- 2 -->
    <rect x="188" y="62" width="144" height="86" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.45"/>
    <circle cx="210" cy="80" r="11" fill="url(#accent)"/><text x="210" y="84.5" font-size="12" font-weight="700" fill="#06101d">2</text>
    <text x="266" y="108" font-size="15" font-weight="700" fill="#e2e8f0">Identity</text>
    <text x="260" y="130" font-size="11" fill="#94a3b8">ArcFace / SFace</text>
    <!-- 3 -->
    <rect x="358" y="62" width="144" height="86" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.45"/>
    <circle cx="380" cy="80" r="11" fill="url(#accent)"/><text x="380" y="84.5" font-size="12" font-weight="700" fill="#06101d">3</text>
    <text x="436" y="108" font-size="15" font-weight="700" fill="#e2e8f0">Role &amp; Ward</text>
    <text x="430" y="130" font-size="11" fill="#94a3b8">Zone + uniform cue</text>
    <!-- 4 -->
    <rect x="528" y="62" width="144" height="86" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.45"/>
    <circle cx="550" cy="80" r="11" fill="url(#accent)"/><text x="550" y="84.5" font-size="12" font-weight="700" fill="#06101d">4</text>
    <text x="606" y="108" font-size="15" font-weight="700" fill="#e2e8f0">Visit</text>
    <text x="600" y="130" font-size="11" fill="#94a3b8">Timeout + merge window</text>
    <!-- 5 -->
    <rect x="698" y="62" width="144" height="86" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.45"/>
    <circle cx="720" cy="80" r="11" fill="url(#accent)"/><text x="720" y="84.5" font-size="12" font-weight="700" fill="#06101d">5</text>
    <text x="776" y="108" font-size="15" font-weight="700" fill="#e2e8f0">Task Evidence</text>
    <text x="770" y="130" font-size="11" fill="#94a3b8">Verified / Needs review</text>
    <!-- 6 -->
    <rect x="868" y="62" width="144" height="86" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.45"/>
    <circle cx="890" cy="80" r="11" fill="url(#accent)"/><text x="890" y="84.5" font-size="12" font-weight="700" fill="#06101d">6</text>
    <text x="946" y="108" font-size="15" font-weight="700" fill="#e2e8f0">Audit Trail</text>
    <text x="940" y="130" font-size="11" fill="#94a3b8">Hash chain + anchors</text>
    <!-- 7 -->
    <rect x="1038" y="62" width="144" height="86" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.45"/>
    <circle cx="1060" cy="80" r="11" fill="url(#accent)"/><text x="1060" y="84.5" font-size="12" font-weight="700" fill="#06101d">7</text>
    <text x="1116" y="108" font-size="15" font-weight="700" fill="#e2e8f0">Dashboard</text>
    <text x="1110" y="130" font-size="11" fill="#94a3b8">Live over WebSocket</text>
  </g>

  <!-- sequential node glow (one pulse per node as the packet passes) -->
  <g fill="none" stroke="#5eead4" stroke-width="3" filter="url(#glow)" opacity="0">
    <rect x="18" y="62" width="144" height="86" rx="12"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.15;1" dur="7.5s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="188" y="62" width="144" height="86" rx="12"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.15;1" dur="7.5s" begin="1.44s" repeatCount="indefinite"/></rect>
    <rect x="358" y="62" width="144" height="86" rx="12"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.15;1" dur="7.5s" begin="2.58s" repeatCount="indefinite"/></rect>
    <rect x="528" y="62" width="144" height="86" rx="12"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.15;1" dur="7.5s" begin="3.72s" repeatCount="indefinite"/></rect>
    <rect x="698" y="62" width="144" height="86" rx="12"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.15;1" dur="7.5s" begin="4.86s" repeatCount="indefinite"/></rect>
    <rect x="868" y="62" width="144" height="86" rx="12"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.15;1" dur="7.5s" begin="6.0s" repeatCount="indefinite"/></rect>
    <rect x="1038" y="62" width="144" height="86" rx="12"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.15;1" dur="7.5s" begin="7.14s" repeatCount="indefinite"/></rect>
  </g>

  <!-- travelling evidence packet -->
  <circle r="7" fill="#5eead4" filter="url(#glow)">
    <animateMotion path="M 40 40 H 1160" dur="7.5s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <line x1="40" y1="40" x2="1160" y2="40" stroke="#38bdf8" stroke-opacity="0.18" stroke-dasharray="2 8"/>
  <text x="600" y="190" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b" letter-spacing="2">EVERY MEANINGFUL STEP IS APPENDED TO THE TAMPER-EVIDENT AUDIT TRAIL</text>
</svg>
